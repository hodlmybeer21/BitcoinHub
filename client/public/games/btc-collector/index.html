<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <title>₿ Bitcoin Collector · BitcoinHub</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0;
      width: 100%; height: 100%;
      overflow: hidden;
      position: fixed;
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
      font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      background: #02030a;
      color: #fff;
    }
    canvas { display: block; touch-action: none; }

    #hud {
      position: absolute;
      top: max(12px, env(safe-area-inset-top, 12px));
      left: 12px;
      z-index: 10;
      padding: 10px 14px;
      background: rgba(0,0,0,0.55);
      border: 2px solid #fbbf24;
      border-radius: 6px;
      font-size: 12px;
      min-width: 200px;
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
    }
    #hud h1 {
      margin: 0 0 6px 0;
      color: #fbbf24;
      font-size: 14px;
      letter-spacing: 2px;
      text-shadow: 0 0 12px rgba(251, 191, 36, 0.4);
    }
    #hud .row { margin: 3px 0; font-size: 13px; }
    #hud .row b { color: #fbbf24; }
    #lives { font-size: 14px; letter-spacing: 3px; }
    #lives .heart { color: #ef4444; text-shadow: 0 0 6px rgba(239,68,68,0.6); }
    #lives .lost { color: #444; }

    /* BitcoinHub footer */
    #hub-footer {
      position: absolute;
      bottom: max(8px, env(safe-area-inset-bottom, 8px));
      left: 50%;
      transform: translateX(-50%);
      z-index: 5;
      font-size: 9px;
      color: rgba(255,255,255,0.35);
      letter-spacing: 1px;
      pointer-events: auto;
      white-space: nowrap;
    }
    #hub-footer a { color: #a78bfa; text-decoration: none; font-weight: 600; }
    #hub-footer .sep { color: rgba(255,255,255,0.18); margin: 0 6px; }
  </style>
</head>
<body>
  <div id="hud">
    <h1>₿ TO THE MOON</h1>
    <div class="row">Score: <b id="score">0</b></div>
    <div class="row">Time: <b id="timer">60</b>s</div>
    <div class="row">Status: <b id="status">Collect the satoshis</b></div>
    <div class="row">Lives: <span id="lives"><span class="heart">♥</span><span class="heart">♥</span><span class="heart">♥</span></span></div>
  </div>

  <div id="hub-footer">
    <a href="https://bitcoinhub.goodbotai.tech" target="_blank" rel="noopener">bitcoinhub</a>
    <span class="sep">·</span>
    <a href="https://bitcoinhub.goodbotai.tech/cycle" target="_blank" rel="noopener">Cycle</a>
    <span class="sep">·</span>
    <a href="https://bitcoinhub.goodbotai.tech/laws" target="_blank" rel="noopener">Laws</a>
  </div>

  <canvas id="game"></canvas>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>

  <script type="module">
  import * as THREE from 'three';
  import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

  // ========== Scene ==========
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x02030a);
  scene.fog = new THREE.FogExp2(0x02030a, 0.030);

  const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 200);
  camera.position.set(0, 0, 13);
  camera.lookAt(0, 0, 0);

  const renderer = new THREE.WebGLRenderer({
    canvas: document.getElementById('game'),
    antialias: window.devicePixelRatio < 2,
    powerPreference: 'high-performance',
  });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

  // ========== Lighting ==========
  scene.add(new THREE.AmbientLight(0xffffff, 0.6));
  const keyLight = new THREE.DirectionalLight(0xffffff, 1.1);
  keyLight.position.set(5, 8, 8);
  scene.add(keyLight);
  const fillLight = new THREE.DirectionalLight(0xfbbf24, 0.5);
  fillLight.position.set(-6, 4, 4);
  scene.add(fillLight);
  const rimLight = new THREE.DirectionalLight(0x60a5fa, 0.4);
  rimLight.position.set(0, -4, -5);
  scene.add(rimLight);

  // ========== Starfield ==========
  {
    const g = new THREE.BufferGeometry();
    const N = 600;
    const pos = new Float32Array(N * 3);
    for (let i = 0; i < N; i++) {
      pos[i*3 + 0] = (Math.random() - 0.5) * 50;
      pos[i*3 + 1] = (Math.random() - 0.5) * 50;
      pos[i*3 + 2] = -10 - Math.random() * 20;
    }
    g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    scene.add(new THREE.Points(g, new THREE.PointsMaterial({
      color: 0xffffff, size: 0.12, sizeAttenuation: true,
      transparent: true, opacity: 0.75,
    })));
  }

  // Distant planet
  const planet = new THREE.Mesh(
    new THREE.SphereGeometry(2.5, 24, 24),
    new THREE.MeshStandardMaterial({
      color: 0xd4a574, roughness: 0.85,
      emissive: 0x442200, emissiveIntensity: 0.4,
    })
  );
  planet.position.set(9, 6, -18);
  scene.add(planet);

  // ========== Bitcoin coin texture (canvas) ==========
  function makeBitcoinTexture() {
    const c = document.createElement('canvas');
    c.width = c.height = 256;
    const ctx = c.getContext('2d');
    const grad = ctx.createRadialGradient(128, 110, 20, 128, 128, 130);
    grad.addColorStop(0, '#fff5b8');
    grad.addColorStop(0.5, '#fbbf24');
    grad.addColorStop(1, '#7c2d12');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, 256, 256);
    ctx.strokeStyle = '#7c2d12';
    ctx.lineWidth = 6;
    ctx.strokeRect(8, 8, 240, 240);
    ctx.fillStyle = '#1a1a1a';
    ctx.font = 'bold 200px "Helvetica Neue", Helvetica, Arial, sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('₿', 128, 138);
    const tex = new THREE.CanvasTexture(c);
    tex.colorSpace = THREE.SRGBColorSpace;
    return tex;
  }

  // ========== Load ship ==========
  const loader = new GLTFLoader();
  let ship = null, shipReady = false;
  const SHIP_BASE_Y = -7.5;
  const ARENA_X = 8;

  loader.load('assets/spaceship.glb', (gltf) => {
    ship = gltf.scene;
    ship.scale.set(0.85, 0.85, 0.85);
    ship.position.set(0, SHIP_BASE_Y, 0);
    scene.add(ship);

    // Thrust particles
    const tpCount = 40;
    const tpGeo = new THREE.BufferGeometry();
    const tpPos = new Float32Array(tpCount * 3);
    const tpVel = [];
    for (let i = 0; i < tpCount; i++) {
      tpPos[i*3+0] = ship.position.x + (Math.random()-0.5) * 0.3;
      tpPos[i*3+1] = ship.position.y - 1.0;
      tpPos[i*3+2] = 0;
      tpVel.push({ life: Math.random(), maxLife: 0.4 + Math.random() * 0.3 });
    }
    tpGeo.setAttribute('position', new THREE.BufferAttribute(tpPos, 3));
    const thrust = new THREE.Points(tpGeo, new THREE.PointsMaterial({
      color: 0xfb923c, size: 0.22, transparent: true, opacity: 0.85,
      sizeAttenuation: true,
    }));
    scene.add(thrust);

    shipReady = true;
    window.__ship = ship;
    window.__thrust = thrust;
    window.__tpVel = tpVel;
    window.__tpCount = tpCount;
    window.__tpPos = tpPos;
  }, undefined, (err) => {
    console.error('Ship load failed:', err);
  });

  // ========== Glow ring under ship ==========
  const glowRing = new THREE.Mesh(
    new THREE.RingGeometry(1.4, 1.9, 48),
    new THREE.MeshBasicMaterial({
      color: 0xfbbf24, transparent: true, opacity: 0.35,
      side: THREE.DoubleSide,
    })
  );
  glowRing.rotation.x = -Math.PI / 2;
  glowRing.position.y = -1.0;
  scene.add(glowRing);

  // ========== Bitcoin coins ==========
  const coinGeo = new THREE.CylinderGeometry(0.55, 0.55, 0.12, 28);
  const coinSideMat = new THREE.MeshStandardMaterial({
    color: 0xd97706, roughness: 0.4, metalness: 0.4,
  });
  const coinFaceMat = new THREE.MeshStandardMaterial({
    map: makeBitcoinTexture(), roughness: 0.4, metalness: 0.3,
  });
  const coins = [];

  function spawnCoin() {
    const coin = new THREE.Mesh(coinGeo, [coinSideMat, coinFaceMat, coinFaceMat]);
    coin.position.set((Math.random() - 0.5) * (ARENA_X * 2), 9, 0);
    coin.userData = { vy: -2.5 - Math.random() * 1.5, rotSpeed: 0.04 + Math.random() * 0.04 };
    scene.add(coin);
    coins.push(coin);
  }

  // ========== Asteroids ==========
  const asteroidGeo = new THREE.IcosahedronGeometry(0.5, 1);
  const aPos = asteroidGeo.attributes.position;
  for (let i = 0; i < aPos.count; i++) {
    const v = new THREE.Vector3().fromBufferAttribute(aPos, i);
    v.multiplyScalar(1 + (Math.random() - 0.5) * 0.4);
    aPos.setXYZ(i, v.x, v.y, v.z);
  }
  asteroidGeo.computeVertexNormals();
  const asteroidMat = new THREE.MeshStandardMaterial({
    color: 0x6b5d50, roughness: 0.95, flatShading: true,
  });
  const asteroids = [];

  function spawnAsteroid() {
    const ast = new THREE.Mesh(asteroidGeo, asteroidMat);
    const scale = 0.6 + Math.random() * 0.5;
    ast.scale.set(scale, scale, scale);
    ast.position.set((Math.random() - 0.5) * (ARENA_X * 2), 9, 0);
    ast.userData = { vy: -2.5 - Math.random() * 1.5, vx: (Math.random() - 0.5) * 1.0, rotX: (Math.random() - 0.5) * 0.08, rotZ: (Math.random() - 0.5) * 0.08 };
    scene.add(ast);
    asteroids.push(ast);
  }

  // ========== Game state ==========
  const state = {
    score: 0,
    lives: 3,
    timeLeft: 60,
    gameOver: false,
    started: false,
    invincible: false,
    invincibleTimer: 0,
    shake: 0,
  };

  const spawn = { coin: 0, asteroid: 0 };

  // ========== Input ==========
  const shipTarget = { x: 0 };
  let touching = false;
  const canvasEl = renderer.domElement;

  function setTargetFromX(clientX) {
    const norm = (clientX / window.innerWidth) * 2 - 1;
    shipTarget.x = norm * ARENA_X;
  }

  canvasEl.addEventListener('touchstart', e => {
    e.preventDefault();
    if (state.gameOver) return;
    touching = true;
    setTargetFromX(e.touches[0].clientX);
  }, { passive: false });

  canvasEl.addEventListener('touchmove', e => {
    e.preventDefault();
    if (!touching) return;
    setTargetFromX(e.touches[0].clientX);
  }, { passive: false });

  canvasEl.addEventListener('touchend', e => {
    e.preventDefault();
    touching = false;
  }, { passive: false });

  canvasEl.addEventListener('touchcancel', () => { touching = false; });

  canvasEl.addEventListener('mousemove', e => {
    if (state.gameOver) return;
    setTargetFromX(e.clientX);
  });

  // Keyboard
  const keys = {};
  window.addEventListener('keydown', e => {
    keys[e.key.toLowerCase()] = true;
    if (['arrowleft','arrowright',' '].includes(e.key.toLowerCase())) e.preventDefault();
  });
  window.addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });

  // ========== UI ==========
  const scoreEl = document.getElementById('score');
  const timerEl = document.getElementById('timer');
  const statusEl = document.getElementById('status');
  const livesEl = document.getElementById('lives');

  function updateLives() {
    let html = '';
    for (let i = 0; i < 3; i++) {
      html += i < state.lives ? '<span class="heart">♥</span>' : '<span class="lost">♥</span>';
    }
    livesEl.innerHTML = html;
  }

  function restart() {
    state.score = 0;
    state.lives = 3;
    state.timeLeft = 60;
    state.gameOver = false;
    state.invincible = false;
    state.invincibleTimer = 0;
    state.shake = 0;
    spawn.coin = 0;
    spawn.asteroid = 0;
    coins.forEach(c => scene.remove(c)); coins.length = 0;
    asteroids.forEach(a => scene.remove(a)); asteroids.length = 0;
    if (ship) ship.position.set(0, SHIP_BASE_Y, 0);
    shipTarget.x = 0;
    scoreEl.textContent = '0';
    timerEl.textContent = '60';
    statusEl.textContent = 'Collect the satoshis';
    updateLives();
  }

  function gameOver() {
    state.gameOver = true;
    statusEl.innerHTML = '<span style="color:#ef4444">GAME OVER — tap to restart</span>';
  }

  canvasEl.addEventListener('click', () => { if (state.gameOver) restart(); });

  // ========== Particles for explosions ==========
  const particles = [];
  const PARTICLE_GEO = new THREE.SphereGeometry(0.08, 6, 4);

  function spawnParticles(pos, color, count, speed, life) {
    for (let i = 0; i < count; i++) {
      const mat = new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 1 });
      const p = new THREE.Mesh(PARTICLE_GEO, mat);
      p.position.copy(pos);
      const a = Math.random() * Math.PI * 2;
      const e = (Math.random() - 0.3) * 2;
      const s = speed * (0.5 + Math.random() * 0.7);
      p.userData = { vx: Math.cos(a) * s, vy: Math.sin(e) * s * 0.5 + Math.random() * s, life: life * (0.5 + Math.random() * 0.5), maxLife: life };
      scene.add(p);
      particles.push(p);
    }
  }

  // ========== Collision ==========
  function shipCollides(obj, radius = 0.7) {
    if (!ship || !shipReady) return false;
    const dx = obj.position.x - ship.position.x;
    const dy = obj.position.y - ship.position.y;
    return Math.sqrt(dx*dx + dy*dy) < radius;
  }

  // ========== Animation loop ==========
  const clock = new THREE.Clock();
  function animate() {
    requestAnimationFrame(animate);
    const dt = Math.min(clock.getDelta(), 0.05);

    // Background drift
    scene.children.forEach(c => {
      if (c.isPoints && c !== window.__thrust) {
        const pos = c.geometry.attributes.position.array;
        for (let i = 1; i < pos.length; i += 3) {
          pos[i] -= 4 * dt;
          if (pos[i] < -22) pos[i] += 44;
        }
        c.geometry.attributes.position.needsUpdate = true;
      }
    });
    planet.rotation.y = performance.now() * 0.00003;
    glowRing.material.opacity = 0.30 + Math.sin(performance.now() * 0.002) * 0.10;

    if (!shipReady) { renderer.render(scene, camera); return; }
    if (state.gameOver) { renderer.render(scene, camera); return; }

    // === Ship movement ===
    if (keys['a'] || keys['arrowleft'])  shipTarget.x -= 8 * dt;
    if (keys['d'] || keys['arrowright']) shipTarget.x += 8 * dt;
    shipTarget.x = Math.max(-ARENA_X, Math.min(ARENA_X, shipTarget.x));
    ship.position.x += (shipTarget.x - ship.position.x) * 0.18;

    // Ship bob + tilt
    ship.position.y = SHIP_BASE_Y + Math.sin(performance.now() * 0.003) * 0.1;
    const tilt = (shipTarget.x - ship.position.x) * 0.4;
    ship.rotation.z += (-tilt - ship.rotation.z) * 0.1;

    // Invincibility blink
    if (state.invincible) {
      state.invincibleTimer -= dt;
      ship.visible = Math.floor(state.invincibleTimer * 12) % 2 === 0;
      if (state.invincibleTimer <= 0) {
        state.invincible = false;
        ship.visible = true;
      }
    }

    // Thrust trail
    if (window.__thrust) {
      const pos = window.__thrust.geometry.attributes.position.array;
      const vel = window.__tpVel;
      for (let i = 0; i < window.__tpCount; i++) {
        vel[i].life += dt;
        if (vel[i].life > vel[i].maxLife) {
          vel[i].life = 0;
          pos[i*3+0] = ship.position.x + (Math.random()-0.5) * 0.3;
          pos[i*3+1] = ship.position.y - 1.0;
          pos[i*3+2] = (Math.random()-0.5) * 0.1;
        }
        pos[i*3+1] -= (3 + Math.random() * 2) * dt;
        pos[i*3+0] += (Math.random() - 0.5) * 0.5 * dt;
      }
      window.__thrust.geometry.attributes.position.needsUpdate = true;
    }

    // === Spawn ===
    spawn.coin += dt;
    if (spawn.coin > 0.8) { spawn.coin = 0; spawnCoin(); }
    spawn.asteroid += dt;
    if (spawn.asteroid > 1.8 + Math.random()) { spawn.asteroid = 0; spawnAsteroid(); }

    // === Update coins ===
    for (let i = coins.length - 1; i >= 0; i--) {
      const c = coins[i];
      c.position.y += c.userData.vy * dt;
      c.rotation.y += c.userData.rotSpeed;
      if (c.position.y < -9) { scene.remove(c); coins.splice(i, 1); continue; }
      if (shipCollides(c, 0.65)) {
        state.score++;
        scoreEl.textContent = state.score;
        spawnParticles(c.position, 0xfbbf24, 8, 4, 0.5);
        scene.remove(c); coins.splice(i, 1);
        if (state.score % 10 === 0) statusEl.textContent = 'TO THE MOON!!';
      }
    }

    // === Update asteroids ===
    for (let i = asteroids.length - 1; i >= 0; i--) {
      const a = asteroids[i];
      a.position.y += a.userData.vy * dt;
      a.position.x += a.userData.vx * dt;
      a.rotation.x += a.userData.rotX;
      a.rotation.z += a.userData.rotZ;
      if (a.position.y < -9) { scene.remove(a); asteroids.splice(i, 1); continue; }
      if (!state.invincible && shipCollides(a, 0.7)) {
        state.lives--;
        state.invincible = true;
        state.invincibleTimer = 1.5;
        state.shake = 0.5;
        spawnParticles(ship.position, 0xef4444, 15, 5, 0.7);
        updateLives();
        scene.remove(a); asteroids.splice(i, 1);
        if (state.lives <= 0) {
          gameOver();
        } else {
          statusEl.innerHTML = '<span style="color:#ef4444">HIT!</span>';
        }
      }
    }

    // === Timer ===
    state.timeLeft -= dt;
    if (state.timeLeft <= 0) {
      state.timeLeft = 0;
      gameOver();
    }
    timerEl.textContent = Math.ceil(state.timeLeft);

    // === Particles ===
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      const ud = p.userData;
      ud.life -= dt;
      if (ud.life <= 0) {
        scene.remove(p); particles.splice(i, 1); continue;
      }
      p.position.x += ud.vx * dt;
      p.position.y += ud.vy * dt;
      p.material.opacity = Math.max(0, ud.life / ud.maxLife);
      p.scale.setScalar(ud.life / ud.maxLife);
    }

    // === Camera shake ===
    if (state.shake > 0) {
      state.shake *= 0.9;
      camera.position.x = (Math.random() - 0.5) * state.shake;
      camera.position.y = (Math.random() - 0.5) * state.shake;
      if (state.shake < 0.01) state.shake = 0;
    } else {
      camera.position.x = 0;
      camera.position.y = 0;
    }

    renderer.render(scene, camera);
  }
  animate();

  // ========== Resize ==========
  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });
  </script>
</body>
</html>
