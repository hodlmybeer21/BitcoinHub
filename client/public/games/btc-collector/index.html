<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <title>₿ Bitcoin Empire · BitcoinHub</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0;
      width: 100%; height: 100%;
      overflow: hidden;
      position: fixed;
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
      font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      background: #02030a;
      color: #fff;
    }
    canvas { display: block; touch-action: none; }

    /* Main HUD */
    #hud {
      position: absolute;
      top: max(14px, env(safe-area-inset-top, 14px));
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      padding: 14px 22px;
      text-align: center;
      pointer-events: none;
    }
    #amount-label {
      font-size: 10px;
      letter-spacing: 3px;
      color: rgba(255,255,255,0.45);
      text-transform: uppercase;
    }
    #amount {
      font-size: 32px;
      font-weight: 800;
      color: #fbbf24;
      letter-spacing: 1px;
      text-shadow: 0 0 18px rgba(251, 191, 36, 0.4);
      margin-top: 2px;
      font-variant-numeric: tabular-nums;
    }
    #amount-sub {
      font-size: 10px;
      color: rgba(255,255,255,0.4);
      margin-top: 4px;
      letter-spacing: 1px;
    }
    #halving-bar {
      width: 220px;
      height: 3px;
      background: rgba(255,255,255,0.08);
      margin: 10px auto 0;
      border-radius: 2px;
      overflow: hidden;
    }
    #halving-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #22d3ee 0%, #fbbf24 100%);
      transition: width 0.2s linear;
    }
    #halving-text {
      font-size: 9px;
      color: rgba(255,255,255,0.4);
      letter-spacing: 1px;
      margin-top: 5px;
    }

    /* Stats corner */
    #stats {
      position: absolute;
      top: max(14px, env(safe-area-inset-top, 14px));
      left: 14px;
      z-index: 10;
      font-size: 10px;
      letter-spacing: 1px;
      pointer-events: none;
    }
    #stats .stat {
      color: rgba(255,255,255,0.45);
      margin-bottom: 4px;
    }
    #stats .stat b {
      color: #a78bfa;
      font-weight: 600;
    }

    /* Halving flash */
    #halving-flash {
      position: absolute;
      inset: 0;
      z-index: 15;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.4s;
    }
    #halving-flash.show { opacity: 1; }
    #halving-flash .text {
      font-size: 28px;
      font-weight: 800;
      color: #22d3ee;
      letter-spacing: 4px;
      text-shadow: 0 0 30px rgba(34, 211, 238, 0.8);
      text-align: center;
    }
    #halving-flash .text small {
      display: block;
      font-size: 12px;
      color: #fbbf24;
      letter-spacing: 2px;
      margin-top: 6px;
    }

    /* BitcoinHub footer */
    #hub-footer {
      position: absolute;
      bottom: max(10px, env(safe-area-inset-bottom, 10px));
      left: 50%;
      transform: translateX(-50%);
      z-index: 5;
      font-size: 9px;
      color: rgba(255,255,255,0.35);
      letter-spacing: 1px;
      pointer-events: auto;
      white-space: nowrap;
    }
    #hub-footer a { color: #a78bfa; text-decoration: none; font-weight: 600; }
    #hub-footer .sep { color: rgba(255,255,255,0.18); margin: 0 6px; }

    /* Tutorial overlay (dismissed on first tap) */
    #tutorial {
      position: absolute;
      bottom: 18%;
      left: 50%;
      transform: translateX(-50%);
      z-index: 12;
      font-size: 11px;
      color: rgba(255,255,255,0.55);
      letter-spacing: 1px;
      text-align: center;
      pointer-events: none;
      animation: fade-pulse 2.4s ease-in-out infinite;
    }
    @keyframes fade-pulse {
      0%, 100% { opacity: 0.4; }
      50% { opacity: 1; }
    }
  </style>
</head>
<body>
  <div id="stats">
    <div class="stat">NODES <b id="nodes-count">0</b></div>
    <div class="stat">RATE <b id="rate-display">1.0</b>/s</div>
  </div>

  <div id="hud">
    <div id="amount-label">YOUR HOLDINGS</div>
    <div id="amount">0.00000000 ₿</div>
    <div id="amount-sub">0 satoshis</div>
    <div id="halving-bar"><div id="halving-fill"></div></div>
    <div id="halving-text">Next halving: <span id="halving-count">60.0</span>s</div>
  </div>

  <div id="halving-flash"><div class="text">HALVING<div id="halving-multiplier">RATE ×0.5</div><small>The code is law</small></div></div>

  <div id="tutorial">Tap anywhere to add a satoshi · Empower the network</div>

  <div id="hub-footer">
    <a href="https://bitcoinhub.goodbotai.tech" target="_blank" rel="noopener">bitcoinhub</a>
    <span class="sep">·</span>
    <a href="https://bitcoinhub.goodbotai.tech/laws" target="_blank" rel="noopener">Laws</a>
    <span class="sep">·</span>
    <a href="https://bitcoinhub.goodbotai.tech/cycle" target="_blank" rel="noopener">Cycle</a>
  </div>

  <canvas id="game"></canvas>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
    }
  }
  </script>

  <script type="module">
  import * as THREE from 'three';

  // ========== Scene ==========
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x02030a);
  scene.fog = new THREE.FogExp2(0x02030a, 0.012);

  const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 200);
  camera.position.set(0, 0, 14);
  camera.lookAt(0, 0, 0);

  const renderer = new THREE.WebGLRenderer({
    canvas: document.getElementById('game'),
    antialias: window.devicePixelRatio < 2,
    powerPreference: 'high-performance',
  });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

  // ========== Lighting ==========
  scene.add(new THREE.AmbientLight(0x303040, 0.6));
  const keyLight = new THREE.DirectionalLight(0xffffff, 0.9);
  keyLight.position.set(5, 10, 8);
  scene.add(keyLight);
  const warmRim = new THREE.DirectionalLight(0xfbbf24, 0.7);
  warmRim.position.set(-5, 4, 4);
  scene.add(warmRim);
  const coolRim = new THREE.DirectionalLight(0x60a5fa, 0.4);
  coolRim.position.set(0, -4, -5);
  scene.add(coolRim);

  // ========== Moon (target) ==========
  const moonGeo = new THREE.SphereGeometry(1.5, 32, 32);
  const moonMat = new THREE.MeshStandardMaterial({
    color: 0xc8c4b8,
    roughness: 0.95,
    emissive: 0x6b6855,
    emissiveIntensity: 0.15,
  });
  const moon = new THREE.Mesh(moonGeo, moonMat);
  moon.position.set(0, 8, -22);
  scene.add(moon);

  // Moon glow halo
  const moonHalo = new THREE.Mesh(
    new THREE.SphereGeometry(2.0, 24, 24),
    new THREE.MeshBasicMaterial({
      color: 0xfbbf24, transparent: true, opacity: 0.12, side: THREE.BackSide,
    })
  );
  moonHalo.position.copy(moon.position);
  scene.add(moonHalo);

  // ========== Stars ==========
  {
    const g = new THREE.BufferGeometry();
    const N = 800;
    const pos = new Float32Array(N * 3);
    for (let i = 0; i < N; i++) {
      pos[i*3+0] = (Math.random() - 0.5) * 80;
      pos[i*3+1] = (Math.random() - 0.5) * 80;
      pos[i*3+2] = -10 - Math.random() * 30;
    }
    g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    scene.add(new THREE.Points(g, new THREE.PointsMaterial({
      color: 0xffffff, size: 0.12, transparent: true, opacity: 0.7, sizeAttenuation: true,
    })));
  }

  // ========== Bitcoin coin (procedural, emissive) ==========
  function makeBitcoinTexture() {
    const c = document.createElement('canvas');
    c.width = c.height = 256;
    const ctx = c.getContext('2d');
    const grad = ctx.createRadialGradient(128, 100, 20, 128, 128, 130);
    grad.addColorStop(0, '#fff5b8');
    grad.addColorStop(0.4, '#fbbf24');
    grad.addColorStop(1, '#7c2d12');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, 256, 256);
    ctx.strokeStyle = '#92400e';
    ctx.lineWidth = 8;
    ctx.strokeRect(10, 10, 236, 236);
    ctx.fillStyle = '#1a1a1a';
    ctx.font = 'bold 180px "Helvetica Neue", Helvetica, Arial, sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('₿', 128, 140);
    const tex = new THREE.CanvasTexture(c);
    tex.colorSpace = THREE.SRGBColorSpace;
    return tex;
  }

  const coinGroup = new THREE.Group();
  const coinSideMat = new THREE.MeshStandardMaterial({
    color: 0xd97706, roughness: 0.3, metalness: 0.6,
    emissive: 0xd97706, emissiveIntensity: 0.4,
  });
  const coinFaceMat = new THREE.MeshStandardMaterial({
    map: makeBitcoinTexture(),
    roughness: 0.4, metalness: 0.4,
    emissive: 0xfbbf24, emissiveIntensity: 0.3,
  });
  const coin = new THREE.Mesh(
    new THREE.CylinderGeometry(1.2, 1.2, 0.25, 48),
    [coinSideMat, coinFaceMat, coinFaceMat]
  );
  coin.rotation.x = Math.PI / 2;
  coinGroup.add(coin);

  // Inner ring (decorative)
  const coinRing = new THREE.Mesh(
    new THREE.TorusGeometry(0.95, 0.04, 8, 48),
    new THREE.MeshStandardMaterial({
      color: 0xfbbf24, emissive: 0xfbbf24, emissiveIntensity: 0.6,
      roughness: 0.4, metalness: 0.6,
    })
  );
  coinRing.position.z = 0.13;
  coinGroup.add(coinRing);

  const coinRing2 = coinRing.clone();
  coinRing2.position.z = -0.13;
  coinGroup.add(coinRing2);

  // Glow halo around coin
  const glowGeo = new THREE.RingGeometry(1.5, 2.4, 48);
  const glowMat = new THREE.MeshBasicMaterial({
    color: 0xfbbf24, transparent: true, opacity: 0.18,
    side: THREE.DoubleSide, depthWrite: false,
  });
  const coinGlow = new THREE.Mesh(glowGeo, glowMat);
  scene.add(coinGlow);

  scene.add(coinGroup);

  // ========== Network nodes (empowered users) ==========
  // Starts empty. Each tap adds a node in a sphere around the coin.
  const nodes = [];
  const nodeMat = new THREE.MeshStandardMaterial({
    color: 0xa78bfa, emissive: 0xa78bfa, emissiveIntensity: 1.0,
    roughness: 0.3, metalness: 0.5,
  });
  const nodeGeo = new THREE.IcosahedronGeometry(0.1, 0);

  function addNode() {
    const node = new THREE.Mesh(nodeGeo, nodeMat.clone());
    // Random position on a sphere of radius 4-6
    const phi = Math.random() * Math.PI * 2;
    const theta = Math.acos(2 * Math.random() - 1);
    const r = 4 + Math.random() * 2;
    node.position.set(
      r * Math.sin(theta) * Math.cos(phi),
      r * Math.sin(theta) * Math.sin(phi),
      r * Math.cos(theta)
    );
    node.userData = {
      baseScale: 1,
      phase: Math.random() * Math.PI * 2,
    };
    scene.add(node);
    nodes.push(node);
    document.getElementById('nodes-count').textContent = nodes.length;
  }

  // ========== Tap particles ==========
  const tapParticles = [];
  const tapParticleGeo = new THREE.SphereGeometry(0.08, 8, 6);

  function spawnTapParticle(targetX, targetY, targetZ, color = 0xfbbf24) {
    for (let i = 0; i < 3; i++) {
      const mat = new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 1 });
      const p = new THREE.Mesh(tapParticleGeo, mat);
      // Start from random screen position-ish (use random offset around coin)
      const a = Math.random() * Math.PI * 2;
      const r = 3 + Math.random() * 2;
      p.position.set(Math.cos(a) * r, Math.sin(a) * r, 0);
      p.userData = {
        tx: targetX, ty: targetY, tz: targetZ,
        life: 0.8, maxLife: 0.8,
        vx: (targetX - p.position.x) * 0.08,
        vy: (targetY - p.position.y) * 0.08,
        vz: (targetZ - p.position.z) * 0.08,
      };
      scene.add(p);
      tapParticles.push(p);
    }
  }

  // ========== Bitcoin text particles (satoshi spawn) ==========
  // When you tap, a stream of small particles shoots toward the coin
  function spawnSatoshiToCoin() {
    const mat = new THREE.MeshBasicMaterial({ color: 0xfbbf24, transparent: true, opacity: 1 });
    const p = new THREE.Mesh(new THREE.SphereGeometry(0.05, 6, 4), mat);
    // Random position outside the visible area
    const a = Math.random() * Math.PI * 2;
    const r = 6 + Math.random() * 2;
    p.position.set(Math.cos(a) * r, Math.sin(a) * r, 0);
    p.userData = {
      tx: 0, ty: 0, tz: 0,
      life: 1.2, maxLife: 1.2,
      vx: -p.position.x * 0.04,
      vy: -p.position.y * 0.04,
      vz: 0,
    };
    scene.add(p);
    tapParticles.push(p);
  }

  // ========== Game state ==========
  const SAT_PER_BTC = 100_000_000;
  let totalSats = 0;                  // accumulated satoshis
  let baseRate = 1.0;                 // satoshis per second at current rate
  let halvingCountdown = 60;         // seconds until next halving
  let lastTime = performance.now();
  let milestone = 1;                 // for triggering node growth

  // ========== UI elements ==========
  const amountEl = document.getElementById('amount');
  const amountSubEl = document.getElementById('amount-sub');
  const halvingFillEl = document.getElementById('halving-fill');
  const halvingCountEl = document.getElementById('halving-count');
  const rateDisplayEl = document.getElementById('rate-display');
  const tutorialEl = document.getElementById('tutorial');
  const halvingFlashEl = document.getElementById('halving-flash');
  const halvingMultiplierEl = document.getElementById('halving-multiplier');

  function formatBTC(sats) {
    return (sats / SAT_PER_BTC).toFixed(8);
  }
  function updateHUD() {
    amountEl.textContent = formatBTC(totalSats) + ' ₿';
    amountSubEl.textContent = Math.floor(totalSats).toLocaleString() + ' satoshis';
    rateDisplayEl.textContent = baseRate.toFixed(2);
    halvingCountEl.textContent = halvingCountdown.toFixed(1);
    halvingFillEl.style.width = ((60 - halvingCountdown) / 60 * 100) + '%';

    // Coin grows with total holdings (logarithmic scale, max ~2.5x)
    const targetScale = 1 + Math.min(1.5, Math.log10(1 + totalSats / 1000) * 0.6);
    coin.scale.lerp(new THREE.Vector3(targetScale, targetScale, targetScale), 0.03);

    // Glow expands with holdings
    coinGlow.scale.lerp(new THREE.Vector3(1 + targetScale * 0.3, 1 + targetScale * 0.3, 1), 0.03);
    glowMat.opacity = 0.18 + Math.min(0.3, totalSats / 100000 * 0.05);
  }

  function triggerHalving() {
    baseRate *= 0.5;
    halvingMultiplierEl.textContent = 'RATE ×' + baseRate.toFixed(2);
    halvingFlashEl.classList.add('show');
    // Bright flash on the coin
    coinFaceMat.emissiveIntensity = 2.0;
    coinRing.material.emissiveIntensity = 2.0;
    coinRing2.material.emissiveIntensity = 2.0;
    setTimeout(() => {
      halvingFlashEl.classList.remove('show');
      coinFaceMat.emissiveIntensity = 0.3;
      coinRing.material.emissiveIntensity = 0.6;
      coinRing2.material.emissiveIntensity = 0.6;
    }, 2500);
    halvingCountdown = 60;
  }

  // ========== Input ==========
  let firstTap = true;
  function onTap(clientX, clientY) {
    if (firstTap) {
      firstTap = false;
      tutorialEl.style.display = 'none';
    }
    // Each tap = 1 satoshi (you "empower" the network by interacting)
    totalSats += 1;
    // Tap spawns: node + particles toward coin
    addNode();
    spawnSatoshiToCoin();
    spawnTapParticle(0, 0, 0, 0xfbbf24);
  }

  const canvasEl = renderer.domElement;
  canvasEl.addEventListener('touchstart', e => {
    e.preventDefault();
    onTap(e.touches[0].clientX, e.touches[0].clientY);
  }, { passive: false });
  canvasEl.addEventListener('mousedown', e => {
    onTap(e.clientX, e.clientY);
  });

  // ========== Animation loop ==========
  const clock = new THREE.Clock();
  function animate() {
    requestAnimationFrame(animate);
    const now = performance.now();
    const dt = Math.min((now - lastTime) / 1000, 0.05);
    lastTime = now;

    // Background drift on stars
    scene.children.forEach(c => {
      if (c.isPoints) {
        const pos = c.geometry.attributes.position.array;
        for (let i = 1; i < pos.length; i += 3) {
          pos[i] -= 1.5 * dt;
          if (pos[i] < -25) pos[i] += 50;
        }
        c.geometry.attributes.position.needsUpdate = true;
      }
    });

    // Slow coin rotation
    coin.rotation.y += dt * 0.3;
    coinRing.rotation.z += dt * 0.5;
    coinRing2.rotation.z -= dt * 0.5;

    // Subtle coin floating
    coinGroup.position.y = Math.sin(now * 0.0008) * 0.15;
    coinGlow.position.y = coinGroup.position.y;

    // Auto-accumulation (mining simulation)
    totalSats += baseRate * dt;

    // Halving countdown
    halvingCountdown -= dt;
    if (halvingCountdown <= 0) triggerHalving();

    // Animate nodes (gentle float)
    for (const node of nodes) {
      const ud = node.userData;
      node.position.y += Math.sin(now * 0.001 + ud.phase) * 0.002;
      node.rotation.x += dt * 0.3;
      node.rotation.y += dt * 0.4;
      const s = ud.baseScale * (1 + Math.sin(now * 0.002 + ud.phase) * 0.15);
      node.scale.setScalar(s);
    }

    // Update tap particles
    for (let i = tapParticles.length - 1; i >= 0; i--) {
      const p = tapParticles[i];
      const ud = p.userData;
      ud.life -= dt;
      if (ud.life <= 0) {
        scene.remove(p);
        p.material.dispose();
        tapParticles.splice(i, 1);
        continue;
      }
      p.position.x += ud.vx * dt * 6;
      p.position.y += ud.vy * dt * 6;
      p.position.z += ud.vz * dt * 6;
      p.material.opacity = Math.max(0, ud.life / ud.maxLife);
      p.scale.setScalar(0.5 + ud.life / ud.maxLife * 0.5);
    }

    updateHUD();
    renderer.render(scene, camera);
  }
  animate();

  // ========== Resize ==========
  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });
  </script>
</body>
</html>
