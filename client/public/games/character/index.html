<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <title>3D Character Viewer · BitcoinHub</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0;
      width: 100%; height: 100%;
      overflow: hidden;
      position: fixed;
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
      font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      background: #02030a;
      color: #fff;
    }
    canvas { display: block; touch-action: none; }

    #topbar {
      position: fixed;
      top: max(12px, env(safe-area-inset-top, 12px));
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      padding: 8px 18px;
      background: rgba(0,0,0,0.55);
      border: 1.5px solid #a78bfa;
      border-radius: 14px;
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      font-size: 12px;
      letter-spacing: 1px;
      color: #a78bfa;
      pointer-events: none;
    }
    #topbar b { color: #fbbf24; font-weight: 700; }

    #hint {
      position: fixed;
      bottom: max(12px, env(safe-area-inset-bottom, 12px));
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      padding: 8px 16px;
      background: rgba(0,0,0,0.55);
      border: 1.5px solid rgba(251,191,36,0.4);
      border-radius: 14px;
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      font-size: 11px;
      letter-spacing: 1px;
      color: rgba(255,255,255,0.6);
      pointer-events: none;
      animation: pulse 2.4s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.5; }
      50% { opacity: 1; }
    }

    #hub-footer {
      position: fixed;
      bottom: 4px; left: 50%;
      transform: translateX(-50%);
      z-index: 3;
      font-size: 8px;
      color: rgba(255,255,255,0.25);
      letter-spacing: 1px;
      pointer-events: auto;
      white-space: nowrap;
    }
    #hub-footer a { color: #a78bfa; text-decoration: none; }
    #hub-footer .sep { color: rgba(255,255,255,0.12); margin: 0 4px; }
  </style>
</head>
<body>
  <div id="topbar"><b>3D Character</b> · drag to orbit</div>
  <div id="hint">Tap the body parts to highlight</div>
  <canvas id="game"></canvas>
  <div id="hub-footer">
    <a href="https://bitcoinhub.goodbotai.tech" target="_blank" rel="noopener">bitcoinhub</a>
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
    }
  }
  </script>

  <script type="module">
  import * as THREE from 'three';

  // ========== Scene ==========
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x0a0a18);
  scene.fog = new THREE.FogExp2(0x0a0a18, 0.025);

  const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 200);
  camera.position.set(0, 0.5, 6);
  camera.lookAt(0, 0, 0);

  const renderer = new THREE.WebGLRenderer({
    canvas: document.getElementById('game'),
    antialias: window.devicePixelRatio < 2,
    powerPreference: 'high-performance',
  });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

  // Lighting (key + warm rim, all emissive-safe)
  scene.add(new THREE.AmbientLight(0x404060, 0.7));
  const keyLight = new THREE.DirectionalLight(0xffffff, 1.0);
  keyLight.position.set(3, 5, 4); scene.add(keyLight);
  const rimLight = new THREE.DirectionalLight(0xfb923c, 0.6);
  rimLight.position.set(-3, 2, 3); scene.add(rimLight);
  const fillLight = new THREE.DirectionalLight(0x60a5fa, 0.4);
  fillLight.position.set(0, -3, 4); scene.add(fillLight);

  // Pedestal / platform
  const pedestalGeo = new THREE.CylinderGeometry(1.4, 1.6, 0.2, 32);
  const pedestalMat = new THREE.MeshStandardMaterial({
    color: 0x1a1a2a, roughness: 0.3, metalness: 0.7,
    emissive: 0x334455, emissiveIntensity: 0.2,
  });
  const pedestal = new THREE.Mesh(pedestalGeo, pedestalMat);
  pedestal.position.y = -1.7;
  scene.add(pedestal);

  // Glow ring under pedestal
  const ringGeo = new THREE.RingGeometry(1.3, 1.5, 48);
  const ringMat = new THREE.MeshBasicMaterial({
    color: 0xfbbf24, transparent: true, opacity: 0.4, side: THREE.DoubleSide,
  });
  const ring = new THREE.Mesh(ringGeo, ringMat);
  ring.rotation.x = -Math.PI / 2;
  ring.position.y = -1.59;
  scene.add(ring);

  // ========== Character (stylized low-poly girl) ==========
  const character = new THREE.Group();

  // Shared materials
  const skinMat = new THREE.MeshStandardMaterial({
    color: 0xf4c8a8, roughness: 0.5, metalness: 0.05,
  });
  const hairMat = new THREE.MeshStandardMaterial({
    color: 0x3a1f0a, roughness: 0.4, metalness: 0.3,
    emissive: 0x1a0f05, emissiveIntensity: 0.1,
  });
  const shirtMat = new THREE.MeshStandardMaterial({
    color: 0x6b5dd3, roughness: 0.6, metalness: 0.1,
  });
  const pantsMat = new THREE.MeshStandardMaterial({
    color: 0x2a2a3a, roughness: 0.7, metalness: 0.1,
  });
  const shoeMat = new THREE.MeshStandardMaterial({
    color: 0x0a0a0a, roughness: 0.5, metalness: 0.3,
  });
  const eyeMat = new THREE.MeshStandardMaterial({
    color: 0x222244, roughness: 0.3, metalness: 0.1,
  });
  const highlightMat = new THREE.MeshBasicMaterial({
    color: 0xfbbf24, transparent: true, opacity: 0.0,
  });

  // ---- Head ----
  const head = new THREE.Mesh(new THREE.SphereGeometry(0.32, 24, 24), skinMat);
  head.position.y = 1.55;
  head.userData = { part: 'head' };
  character.add(head);

  // Hair (top + back)
  const hairTop = new THREE.Mesh(new THREE.SphereGeometry(0.34, 24, 16, 0, Math.PI * 2, 0, Math.PI * 0.55), hairMat);
  hairTop.position.y = 1.65;
  character.add(hairTop);

  // Hair ponytail/back
  const hairBack = new THREE.Mesh(new THREE.CylinderGeometry(0.18, 0.05, 0.5, 16), hairMat);
  hairBack.position.set(0, 1.4, -0.28);
  hairBack.rotation.x = 0.2;
  character.add(hairBack);

  // Side hair strands (bangs)
  for (const side of [-1, 1]) {
    const bang = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.25, 0.08), hairMat);
    bang.position.set(side * 0.18, 1.65, 0.15);
    bang.rotation.z = side * 0.15;
    character.add(bang);
  }

  // Eyes
  for (const side of [-1, 1]) {
    const eye = new THREE.Mesh(new THREE.SphereGeometry(0.04, 12, 12), eyeMat);
    eye.position.set(side * 0.11, 1.58, 0.28);
    character.add(eye);
  }

  // Smile (small dark curve approximated by a thin torus)
  const smile = new THREE.Mesh(
    new THREE.TorusGeometry(0.05, 0.008, 8, 16, Math.PI),
    new THREE.MeshBasicMaterial({ color: 0x551111 })
  );
  smile.position.set(0, 1.43, 0.29);
  smile.rotation.x = Math.PI;
  character.add(smile);

  // ---- Neck ----
  const neck = new THREE.Mesh(new THREE.CylinderGeometry(0.09, 0.11, 0.12, 16), skinMat);
  neck.position.y = 1.25;
  character.add(neck);

  // ---- Torso (with shirt) ----
  const torso = new THREE.Mesh(new THREE.CylinderGeometry(0.22, 0.28, 0.7, 16), shirtMat);
  torso.position.y = 0.85;
  torso.userData = { part: 'torso' };
  character.add(torso);

  // ---- Arms ----
  // Left arm (slightly bent)
  const leftUpperArm = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.07, 0.32, 12), shirtMat);
  leftUpperArm.position.set(-0.36, 0.95, 0);
  leftUpperArm.rotation.z = 0.2;
  character.add(leftUpperArm);
  const leftForearm = new THREE.Mesh(new THREE.CylinderGeometry(0.055, 0.06, 0.32, 12), skinMat);
  leftForearm.position.set(-0.46, 0.65, 0);
  leftForearm.rotation.z = 0.15;
  character.add(leftForearm);
  const leftHand = new THREE.Mesh(new THREE.SphereGeometry(0.06, 12, 12), skinMat);
  leftHand.position.set(-0.50, 0.45, 0);
  character.add(leftHand);

  // Right arm
  const rightUpperArm = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.07, 0.32, 12), shirtMat);
  rightUpperArm.position.set(0.36, 0.95, 0);
  rightUpperArm.rotation.z = -0.2;
  character.add(rightUpperArm);
  const rightForearm = new THREE.Mesh(new THREE.CylinderGeometry(0.055, 0.06, 0.32, 12), skinMat);
  rightForearm.position.set(0.46, 0.65, 0);
  rightForearm.rotation.z = -0.15;
  character.add(rightForearm);
  const rightHand = new THREE.Mesh(new THREE.SphereGeometry(0.06, 12, 12), skinMat);
  rightHand.position.set(0.50, 0.45, 0);
  character.add(rightHand);

  // ---- Hips / pants ----
  const hips = new THREE.Mesh(new THREE.CylinderGeometry(0.28, 0.26, 0.18, 16), pantsMat);
  hips.position.y = 0.45;
  character.add(hips);

  // ---- Legs ----
  const leftLeg = new THREE.Mesh(new THREE.CylinderGeometry(0.085, 0.075, 0.7, 12), pantsMat);
  leftLeg.position.set(-0.13, -0.05, 0);
  character.add(leftLeg);
  const rightLeg = new THREE.Mesh(new THREE.CylinderGeometry(0.085, 0.075, 0.7, 12), pantsMat);
  rightLeg.position.set(0.13, -0.05, 0);
  character.add(rightLeg);

  // ---- Shoes ----
  const leftShoe = new THREE.Mesh(new THREE.BoxGeometry(0.14, 0.08, 0.22), shoeMat);
  leftShoe.position.set(-0.13, -0.46, 0.04);
  character.add(leftShoe);
  const rightShoe = new THREE.Mesh(new THREE.BoxGeometry(0.14, 0.08, 0.22), shoeMat);
  rightShoe.position.set(0.13, -0.46, 0.04);
  character.add(rightShoe);

  // ---- Bitcoin badge on shirt ----
  function makeBitcoinTexture() {
    const c = document.createElement('canvas');
    c.width = c.height = 64;
    const ctx = c.getContext('2d');
    ctx.fillStyle = '#fbbf24';
    ctx.fillRect(0, 0, 64, 64);
    ctx.fillStyle = '#1a1a1a';
    ctx.font = 'bold 48px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('₿', 32, 36);
    const tex = new THREE.CanvasTexture(c);
    tex.colorSpace = THREE.SRGBColorSpace;
    return tex;
  }
  const badge = new THREE.Mesh(
    new THREE.CircleGeometry(0.09, 24),
    new THREE.MeshBasicMaterial({ map: makeBitcoinTexture() })
  );
  badge.position.set(0.10, 0.95, 0.28);
  character.add(badge);

  // Pickable highlight overlay (initialized once, hidden by default)
  const highlight = new THREE.Mesh(
    new THREE.SphereGeometry(0.5, 16, 16),
    highlightMat
  );
  character.add(highlight);
  highlight.visible = false;

  scene.add(character);

  // ========== Stars ==========
  {
    const g = new THREE.BufferGeometry();
    const N = 300;
    const pos = new Float32Array(N * 3);
    for (let i = 0; i < N; i++) {
      pos[i*3+0] = (Math.random() - 0.5) * 50;
      pos[i*3+1] = (Math.random() - 0.5) * 30;
      pos[i*3+2] = -10 - Math.random() * 20;
    }
    g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    scene.add(new THREE.Points(g, new THREE.PointsMaterial({
      color: 0xffffff, size: 0.08, transparent: true, opacity: 0.6, sizeAttenuation: true,
    })));
  }

  // ========== Orbit camera (touch + mouse) ==========
  let angleY = 0.3, angleX = 0.0;
  let targetY = 0.3, targetX = 0.0;
  const camDist = 6;
  let isDragging = false, lastTX = 0, lastTY = 0, lastMX = 0, lastMY = 0;

  function updateCameraPos() {
    angleY += (targetY - angleY) * 0.08;
    angleX += (targetX - angleX) * 0.08;
    targetX = Math.max(-Math.PI/2.2, Math.min(Math.PI/2.2, targetX));
    const r = camDist, c = Math.cos(angleX);
    camera.position.x = Math.sin(angleY) * c * r;
    camera.position.z = Math.cos(angleY) * c * r;
    camera.position.y = Math.sin(angleX) * r + 0.5;
    camera.lookAt(0, 0.3, 0);
  }

  const canvasEl = renderer.domElement;
  canvasEl.addEventListener('touchstart', e => {
    e.preventDefault();
    isDragging = true;
    lastTX = e.touches[0].clientX;
    lastTY = e.touches[0].clientY;
    // Highlight detect
    handleTap(e.touches[0].clientX, e.touches[0].clientY);
  }, { passive: false });
  canvasEl.addEventListener('touchmove', e => {
    e.preventDefault();
    const dx = e.touches[0].clientX - lastTX;
    const dy = e.touches[0].clientY - lastTY;
    targetY += dx * 0.008;
    targetX += dy * 0.008;
    lastTX = e.touches[0].clientX;
    lastTY = e.touches[0].clientY;
  }, { passive: false });
  const endHandler = e => { e.preventDefault(); isDragging = false; };
  canvasEl.addEventListener('touchend', endHandler, { passive: false });
  canvasEl.addEventListener('touchcancel', () => { isDragging = false; });

  canvasEl.addEventListener('mousedown', e => {
    isDragging = true;
    lastMX = e.clientX;
    lastMY = e.clientY;
    handleTap(e.clientX, e.clientY);
  });
  canvasEl.addEventListener('mousemove', e => {
    if (!isDragging) return;
    targetY += (e.clientX - lastMX) * 0.008;
    targetX += (e.clientY - lastMY) * 0.008;
    lastMX = e.clientX;
    lastMY = e.clientY;
  });
  canvasEl.addEventListener('mouseup', () => { isDragging = false; });
  canvasEl.addEventListener('mouseleave', () => { isDragging = false; });

  // Tap detection (highlight body part)
  const raycaster = new THREE.Raycaster();
  const mouse = new THREE.Vector2();
  function handleTap(clientX, clientY) {
    mouse.x = (clientX / window.innerWidth) * 2 - 1;
    mouse.y = -(clientY / window.innerHeight) * 2 + 1;
    raycaster.setFromCamera(mouse, camera);
    const hits = raycaster.intersectObjects(character.children, true);
    if (hits.length > 0) {
      let obj = hits[0].object;
      while (obj.parent && obj.parent !== character) obj = obj.parent;
      // Place highlight sphere at hit position
      highlight.position.copy(hits[0].point);
      highlight.scale.setScalar(1.0);
      highlight.visible = true;
      highlightMat.opacity = 0.35;
      highlightMat.color.setHex(0xfbbf24);
      // Fade out
      const startTime = performance.now();
      const fade = () => {
        const elapsed = (performance.now() - startTime) / 1000;
        if (elapsed > 1.5) { highlight.visible = false; return; }
        highlightMat.opacity = 0.35 * (1 - elapsed / 1.5);
        requestAnimationFrame(fade);
      };
      fade();
    }
  }

  // ========== Animation loop ==========
  const clock = new THREE.Clock();
  function animate() {
    requestAnimationFrame(animate);
    const dt = Math.min(clock.getDelta(), 0.05);
    const now = performance.now();

    // Gentle idle breathing + hair sway
    character.position.y = Math.sin(now * 0.0012) * 0.04;
    hairBack.rotation.x = 0.2 + Math.sin(now * 0.002) * 0.08;
    for (const side of [-1, 1]) {
      // Bangs sway slightly
    }

    // Pedestal ring pulse
    ringMat.opacity = 0.3 + Math.sin(now * 0.002) * 0.15;

    // Stars drift
    scene.children.forEach(c => {
      if (c.isPoints) {
        const pos = c.geometry.attributes.position.array;
        for (let i = 1; i < pos.length; i += 3) {
          pos[i] -= 0.5 * dt;
          if (pos[i] < -15) pos[i] += 30;
        }
        c.geometry.attributes.position.needsUpdate = true;
      }
    });

    updateCameraPos();
    renderer.render(scene, camera);
  }
  animate();

  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });
  </script>
</body>
</html>
